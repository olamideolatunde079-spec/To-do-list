<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://fontawesome.com/icons"/>
</head>
<body>
  <div>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <h1>Smart To-Do List</h1>
      </div>
    </header>

    <section class="task-creator card">
      <form id="taskForm">
        <label for="taskInput">New task</label>
        <div class="input-group">
          <input id="taskInput" type="text" placeholder="Add a new task..." autocomplete="off"></input>
          <input id="dueDateInput" type="date"> </input>
          <button type="submit">Add</button>
        </div>
      </form>
    </section>

    <section class="controls card">
      <div class="search-group">
        <label for="searchInput">Search</label>
        <input id="searchInput" type="search" placeholder="Search tasks..." />
      </div>
      <div class="filters">
        <button type="button" class="filter-btn active" data-filter="all">All</button>
        <button type="button" class="filter-btn" data-filter="active">Active</button>
        <button type="button" class="filter-btn" data-filter="completed">Completed</button>
      </div>
    </section>

    <section class="stats card">
      <div class="stat-grid">
        <div>
          <p>Total</p>
          <strong id="totalCount">0</strong>
        </div>
        <div>
          <p>Completed</p>
          <strong id="completedCount">0</strong>
        </div>
        <div>
          <p>Remaining</p>
          <strong id="remainingCount">0</strong>
        </div>
      </div>
    
    </section>

    <section class="task-list card">
      <ul id="tasks"></ul>
  </div>

  <script src="work.js"></script>
</body>
</html>
